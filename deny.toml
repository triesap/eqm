[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
  "Apache-2.0",
  "MIT",
  "Unicode-3.0",
  "Unlicense",
  # Zlib (permissive, OSI/FSF) is required transitively by the exact-pinned
  # Draft 2020-12 conformance validator `jsonschema` (dev-only) through
  # `referencing` -> `hashbrown` -> `foldhash`. Recorded under DEV-003 decision 6.
  "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
