name: release-dry-run
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5
        with:
          toolchain: 1.97.1
      - name: Build non-publishing package
        run: bash scripts/package_release.sh "$RUNNER_TEMP/package"
      - name: Inspect package
        run: tar -tzf "$RUNNER_TEMP"/package/*.tar.gz
