name: Verify

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install exact Rust toolchain
        uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5
        with:
          toolchain: 1.97.1
          components: clippy, rustfmt

      - name: Install verification tools
        run: |
          cargo install --locked cargo-audit --version 0.22.1
          cargo install --locked cargo-deny --version 0.19.8

      - name: Run repository verification
        run: bash scripts/verify.sh

      - name: Require a clean checkout
        run: test -z "$(git status --porcelain --untracked-files=all)"

  cross-platform:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install exact Rust toolchain
        uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5
        with:
          toolchain: 1.97.1
          components: clippy, rustfmt

      - name: Check cross-platform workspace
        run: cargo check --workspace --all-targets --locked

      - name: Test cross-platform workspace
        run: cargo test --workspace --all-targets --locked

      - name: Lint cross-platform workspace
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
