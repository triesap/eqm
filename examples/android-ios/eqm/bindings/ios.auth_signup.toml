schema = "https://raw.githubusercontent.com/triesap/eqm/master/schemas/v1/manifest/binding.schema.json"
id = "binding.ios.auth_signup"
revision = 1
owners = ["owner://team/ios"]
target = "ios"
unit = "account.create.signup.identifier"

[[artifacts]]
id = "identifier_view"
role = "view"
path = "apps/ios/Signup/Sources/SignupView.swift"
surface = "account.create.signup.identifier"

[[exposures]]
surface = "account.create.signup.identifier"
state = "required"
route = "signup"

[[evidence]]
id = "identifier_behavior"
kind = "test"
requirements = ["account.create.signup.identifier#email_default"]
facets = ["behavior"]
runner = "runner.ios"

[evidence.selector]
kind = "test"
framework = "xctest"
test_id = "testSignupIdentifierDefaultsToEmail"
