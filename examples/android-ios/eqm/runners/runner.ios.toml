schema = "https://raw.githubusercontent.com/triesap/eqm/master/schemas/v1/manifest/runner.schema.json"
id = "runner.ios"
revision = 1
owners = ["owner://team/ios"]
backend = "local"
program = "apps/ios/bin/run-xctest"
args = ["--scheme", "Signup", "--selector", "{selector_json}", "--result", "{result_path}"]
cwd = "{target_root}"
timeout_ms = 60000
max_output_bytes = 1048576
max_concurrency = 1

[[environment]]
name = "PATH"
source = "trusted_path"
