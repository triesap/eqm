schema = "https://schemas.equivalencematrix.dev/v1/runner"
id = "runner.android"
revision = 1
owners = ["owner://team/android"]
backend = "local"
program = "apps/android/gradlew"
args = ["connectedCheck", "--eqm-selector", "{selector_json}", "--eqm-result", "{result_path}"]
cwd = "{target_root}"
timeout_ms = 60000
max_output_bytes = 1048576
max_concurrency = 1

[[environment]]
name = "PATH"
source = "trusted_path"
