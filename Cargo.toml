[workspace]
resolver = "3"
members = [
    "crates/eqm_cli",
    "crates/eqm_domain",
    "crates/eqm_engine",
    "crates/eqm_manifest",
    "crates/eqm_mcp",
    "crates/eqm_protocol",
    "crates/eqm_runner",
    "crates/eqm_test_support",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["Tyson Lupul <tyson@radroots.org>"]
readme = "README.md"
repository = "https://github.com/triesap/eqm"
rust-version = "1.97.1"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"

[workspace.dependencies]
chrono = { version = "=0.4.42", default-features = false, features = ["std"] }
sha2 = "=0.10.9"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
serde_json_canonicalizer = "=0.3.2"
schemars = "=1.2.2"
globset = "=0.4.19"
toml = "=1.1.4"
tempfile = "=3.27.0"
toml_edit = "=0.25.13"
unicode-normalization = "=0.1.24"
eqm_domain = { path = "crates/eqm_domain", version = "=0.1.0" }
eqm_engine = { path = "crates/eqm_engine", version = "=0.1.0" }
eqm_manifest = { path = "crates/eqm_manifest", version = "=0.1.0" }
eqm_mcp = { path = "crates/eqm_mcp", version = "=0.1.0" }
eqm_protocol = { path = "crates/eqm_protocol", version = "=0.1.0" }
eqm_runner = { path = "crates/eqm_runner", version = "=0.1.0" }
