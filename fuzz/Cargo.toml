[package]
name = "eqm-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "=0.4.10"
serde_json = "=1.0.145"
serde_json_canonicalizer = "=0.3.2"
eqm_domain = { path = "../crates/eqm_domain" }
eqm_manifest = { path = "../crates/eqm_manifest" }
eqm_protocol = { path = "../crates/eqm_protocol" }
eqm_runner = { path = "../crates/eqm_runner" }

[workspace]
members = ["."]

[[bin]]
name = "toml"
path = "fuzz_targets/toml.rs"
test = false
doc = false

[[bin]]
name = "protocol"
path = "fuzz_targets/protocol.rs"
test = false
doc = false

[[bin]]
name = "adapter"
path = "fuzz_targets/adapter.rs"
test = false
doc = false

[[bin]]
name = "inventory"
path = "fuzz_targets/inventory.rs"
test = false
doc = false

[[bin]]
name = "evidence"
path = "fuzz_targets/evidence.rs"
test = false
doc = false

[[bin]]
name = "canonicalization"
path = "fuzz_targets/canonicalization.rs"
test = false
doc = false

[[bin]]
name = "graph"
path = "fuzz_targets/graph.rs"
test = false
doc = false
